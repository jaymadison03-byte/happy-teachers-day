<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Teacher's Day – Louie G.</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 15%, rgba(255, 215, 135, .18), transparent 24%),
        radial-gradient(circle at 85% 85%, rgba(184, 139, 67, .15), transparent 28%),
        linear-gradient(135deg, #10242d 0%, #193a40 45%, #314b45 70%, #6d563b 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      position: relative;
    }

    /* Ambient glow */
    body::before {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(241, 202, 119, .12);
      filter: blur(100px);
      top: -220px;
      left: -180px;
    }

    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(255, 232, 174, .08);
      filter: blur(110px);
      bottom: -250px;
      right: -180px;
    }

    .card {
      position: relative;
      width: min(92vw, 1050px);
      min-height: min(78vh, 650px);
      padding: 70px 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 32px;
      background: rgba(255, 255, 255, .075);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 35px 100px rgba(0, 0, 0, .38),
        inset 0 1px 0 rgba(255, 255, 255, .18);
      overflow: hidden;
    }

    /* Decorative frame */
    .card::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(239, 207, 139, .28);
      border-radius: 23px;
      pointer-events: none;
    }

    .card::after {
      content: "✦";
      position: absolute;
      top: 27px;
      left: 50%;
      transform: translateX(-50%);
      color: #e9c879;
      font-size: 18px;
      text-shadow: 0 0 18px rgba(233, 200, 121, .7);
    }

    .content {
      position: relative;
      z-index: 5;
      max-width: 850px;
    }

    .top-ornament {
      color: #e8c878;
      font-size: 20px;
      letter-spacing: 12px;
      margin-bottom: 30px;
      text-shadow: 0 0 20px rgba(232, 200, 120, .35);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255, 232, 177, .8);
      margin-bottom: 22px;
    }

    .message {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(46px, 6.3vw, 78px);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -1.5px;
      color: #fffaf0;
      text-shadow: 0 7px 35px rgba(0, 0, 0, .28);
    }

    .message .gold {
      color: #f0d28b;
      font-style: italic;
      text-shadow: 0 0 25px rgba(240, 210, 139, .15);
    }

    .divider {
      width: 180px;
      height: 1px;
      margin: 34px auto 22px;
      background: linear-gradient(
        90deg,
        transparent,
        #e9c879,
        transparent
      );
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "◆";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #e9c879;
      font-size: 6px;
    }

    .divider::before {
      left: 27px;
    }

    .divider::after {
      right: 27px;
    }

    .signature {
      font-family: 'Cormorant Garamond', serif;
      font-size: 29px;
      font-style: italic;
      color: #e8c879;
    }

    /* Floating stars */
    .star {
      position: absolute;
      color: rgba(247, 218, 153, .65);
      animation: float 5s ease-in-out infinite;
      user-select: none;
    }

    .star.one {
      top: 16%;
      left: 9%;
      font-size: 17px;
    }

    .star.two {
      top: 25%;
      right: 9%;
      font-size: 25px;
      animation-delay: 1.2s;
    }

    .star.three {
      bottom: 20%;
      left: 14%;
      font-size: 12px;
      animation-delay: 2s;
    }

    .star.four {
      bottom: 16%;
      right: 15%;
      font-size: 17px;
      animation-delay: .7s;
    }

    .star.five {
      top: 12%;
      right: 27%;
      font-size: 9px;
      animation-delay: 1.8s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
        opacity: .4;
      }
      50% {
        transform: translateY(-12px) scale(1.15);
        opacity: 1;
      }
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 70px;
      height: 70px;
      border-color: rgba(233, 200, 121, .55);
      border-style: solid;
      z-index: 3;
    }

    .corner.tl {
      top: 35px;
      left: 35px;
      border-width: 1px 0 0 1px;
    }

    .corner.tr {
      top: 35px;
      right: 35px;
      border-width: 1px 1px 0 0;
    }

    .corner.bl {
      bottom: 35px;
      left: 35px;
      border-width: 0 0 1px 1px;
    }

    .corner.br {
      bottom: 35px;
      right: 35px;
      border-width: 0 1px 1px 0;
    }

    @media (max-width: 700px) {
      .card {
        width: 92vw;
        min-height: 82vh;
        padding: 55px 28px;
        border-radius: 25px;
      }

      .card::before {
        inset: 12px;
        border-radius: 18px;
      }

      .corner {
        width: 45px;
        height: 45px;
      }

      .corner.tl,
      .corner.tr {
        top: 25px;
      }

      .corner.bl,
      .corner.br {
        bottom: 25px;
      }

      .corner.tl,
      .corner.bl {
        left: 25px;
      }

      .corner.tr,
      .corner.br {
        right: 25px;
      }

      .eyebrow {
        letter-spacing: 3px;
        font-size: 9px;
      }

      .message {
        font-size: clamp(39px, 11vw, 60px);
      }

      .top-ornament {
        font-size: 15px;
        letter-spacing: 8px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <span class="star one">✦</span>
    <span class="star two">✧</span>
    <span class="star three">✦</span>
    <span class="star four">✧</span>
    <span class="star five">·</span>

    <section class="content">

      <div class="top-ornament">✦ &nbsp; ✧ &nbsp; ✦</div>

      <div class="eyebrow">With Gratitude &amp; Appreciation</div>

      <div class="message">
        Happy <span class="gold">Teacher's Day</span><br>
        to All Teachers,<br>
        Aspiring Teachers,<br>
        and Teachers in Nature
      </div>

      <div class="divider"></div>

      <div class="signature">–Louie G.</div>

    </section>

  </main>

</body>
</html>
